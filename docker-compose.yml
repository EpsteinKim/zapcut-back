version: "3.8"

services:
  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: zapcut-nginx
    restart: unless-stopped
    ports:
      - "8800:8800"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-logs:/var/log/nginx
    # depends_on 제거 - 동적으로 환경을 전환하므로 고정 의존성 불필요
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - zapcut-network

  # 블루 환경 (포트 8000)
  zapcut-api-blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: zapcut-api:latest
    container_name: zapcut-api-blue
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=blue
      - DEPLOYMENT_DATE=${BLUE_DEPLOYMENT_DATE:-Unknown}
      - TZ=Asia/Seoul
    volumes:
      - ./temp:/app/temp
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zapcut-network

  # 그린 환경 (포트 8001)
  zapcut-api-green:
    build:
      context: .
      dockerfile: Dockerfile
    image: zapcut-api:latest
    container_name: zapcut-api-green
    restart: unless-stopped
    ports:
      - "8001:8000" # 외부 8001 -> 내부 8000
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=green
      - DEPLOYMENT_DATE=${GREEN_DEPLOYMENT_DATE:-Unknown}
      - TZ=Asia/Seoul
    volumes:
      - ./temp:/app/temp
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"] # 컨테이너 내부는 8000 포트
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zapcut-network

# 네트워크 설정 추가
networks:
  zapcut-network:
    driver: bridge
