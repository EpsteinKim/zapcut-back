events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker DNS resolver 설정
    resolver 127.0.0.11 valid=30s;

    # 로그 설정
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # 기본 설정
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 업스트림 설정 - 동적 해결 방식 (컨테이너가 없어도 작동)
    # upstream zapcut_backend {
    #     server zapcut-api-blue:8000 max_fails=3 fail_timeout=30s;
    #     server zapcut-api-green:8000 max_fails=3 fail_timeout=30s backup;
    # }

    # 메인 서버 설정
    server {
        listen 8800;
        server_name api.zapcut.io;  # 도메인 설정
        
        # 요청 크기 제한
        client_max_body_size 100M;
        
        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 메인 API 프록시 - 동적 백엔드 선택 (우선순위 변경 가능)
        location / {
            # 현재 활성 환경 우선 시도 (배포 스크립트에서 변경됨)
            # ACTIVE_ENV=blue: 블루 우선 → 그린 fallback
            # ACTIVE_ENV=green: 그린 우선 → 블루 fallback
            set $primary_backend "zapcut-api-blue:8000";  # 기본값: 블루 우선
            set $fallback_backend "zapcut-api-green:8000";
            
            proxy_pass http://$primary_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 지원
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 주 환경 실패 시 fallback 환경으로 전환
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_intercept_errors on;
            error_page 502 503 504 = @fallback_env;
        }

        # Fallback 환경으로 전환
        location @fallback_env {
            set $fallback_backend "zapcut-api-green:8000";  # 기본값: 그린 fallback
            proxy_pass http://$fallback_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Fallback 환경도 실패 시 에러 반환
            proxy_intercept_errors on;
            error_page 502 503 504 = @all_down;
        }

        # 모든 환경이 다운된 경우
        location @all_down {
            return 503 '{"error": "All environments are down", "status": 503}';
            add_header Content-Type application/json;
        }

        # 헬스체크 엔드포인트 - 활성 환경 우선
        location /health {
            set $primary_backend "zapcut-api-blue:8000";  # 기본값: 블루 우선
            proxy_pass http://$primary_backend/health;
            proxy_set_header Host $host;
            access_log off;
            
            # 주 환경 실패 시 fallback 환경으로 전환
            proxy_intercept_errors on;
            error_page 502 503 504 = @health_fallback;
        }

        # 헬스체크 fallback
        location @health_fallback {
            set $fallback_backend "zapcut-api-green:8000";  # 기본값: 그린 fallback
            proxy_pass http://$fallback_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # 블루 환경 직접 접근 (테스트용) - 동적 해결
        location /blue/ {
            set $blue_backend "zapcut-api-blue:8000";
            proxy_pass http://$blue_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 연결 실패 시 에러 페이지 반환
            proxy_intercept_errors on;
            error_page 502 503 504 = @blue_error;
        }

        # 그린 환경 직접 접근 (테스트용) - 동적 해결
        location /green/ {
            set $green_backend "zapcut-api-green:8000";
            proxy_pass http://$green_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 연결 실패 시 에러 페이지 반환
            proxy_intercept_errors on;
            error_page 502 503 504 = @green_error;
        }

        # 에러 페이지 처리
        location @blue_error {
            return 503 '{"error": "Blue environment is not available", "status": 503}';
            add_header Content-Type application/json;
        }

        location @green_error {
            return 503 '{"error": "Green environment is not available", "status": 503}';
            add_header Content-Type application/json;
        }

        # Nginx 상태 페이지
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
} 