version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: zapcut-nginx
    restart: unless-stopped
    ports:
      - "8800:8800"
    environment:
      - TZ=Asia/Seoul
    volumes:
      # - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - zapcut-net

  zapcut-api-blue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEPLOYMENT_DATE: ${DEPLOYMENT_DATE}
    image: zapcut-api:latest
    container_name: zapcut-api-blue
    restart: unless-stopped
    environment:
      - ENVIRONMENT=blue
      - DEPLOYMENT_DATE=${DEPLOYMENT_DATE}
    volumes:
      - ./.env:/zapcut-back/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zapcut-net

  zapcut-api-green:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEPLOYMENT_DATE: ${DEPLOYMENT_DATE}
    image: zapcut-api:latest
    container_name: zapcut-api-green
    restart: unless-stopped
    environment:
      - ENVIRONMENT=green
      - DEPLOYMENT_DATE=${DEPLOYMENT_DATE}
    volumes:
      - ./.env:/zapcut-back/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zapcut-net

networks:
  zapcut-net:
